[package]
name = "kinema-mpv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Isolated runtime-loaded libmpv playback and rendering backend"

# Deliberately do not inherit workspace unsafe_code=forbid: this crate is the
# audited native FFI boundary. Desktop and core continue to forbid unsafe code.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

[features]
default = ["gpu-surface"]
gpu-render = ["dep:glow"]
gpu-surface = ["gpu-render", "dep:wgpu", "dep:wgpu-hal", "dep:ash", "dep:windows", "dep:objc2-core-foundation", "dep:objc2-core-video"]

[dependencies]
glow = { workspace = true, optional = true }
libloading.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
wgpu = { workspace = true, optional = true }
wgpu-hal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D11on12", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, optional = true }
objc2-core-video = { workspace = true, optional = true }
