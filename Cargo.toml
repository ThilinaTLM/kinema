[workspace]
members = ["crates/kinema-core", "crates/kinema-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
unicode-segmentation = "1.13"
kinema-core = { path = "crates/kinema-core" }
gpui-kit = "=0.7.3"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
wasm-bindgen = "=0.2.129"
directories = "6.0.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1.18", default-features = false }
fs4 = { version = "1.1.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
rand = { version = "0.9.2", default-features = false, features = ["thread_rng"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
zeroize = "1.8"
toml = "1.1"
url = "2.5"
percent-encoding = "2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = 1

# Optimize codecs/transport while keeping workspace development builds cheap.
[profile.dev.package."*"]
opt-level = 2
