<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Kinema — desktop design prototype (design-only, not connected)</title>
<style>
/* Kinema "Graphite" design tokens (design-only prototype). Semantic names; see docs/design/README.md */
:root{
  --d-fast:100ms;--d-med:140ms;--d-slow:180ms;--ease:cubic-bezier(.2,0,0,1);
  --font:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI","Noto Sans",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --s2:2px;--s4:4px;--s6:6px;--s8:8px;--s12:12px;--s16:16px;--s20:20px;--s24:24px;--s32:32px;
  --rail:56px;--hit:36px;--glyph:18px;--toolbar:44px;--ctl:28px;--ctl-sm:24px;--gap:12px;--pad:16px;
  --r:4px;--rp:6px;--card-meta:76px;--fs-body:13px;--fs-label:12px;--fs-meta:11px;--fs-head:18px;--fs-title:20px;
  --imdb:#F5C518;--imdb-ink:#1F232B;
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg0:#17191d;--bg1:#202227;--bg2:#292c33;--bg3:#31353d;--line:#353942;--ctl-b:#6E7788;
  --tx:#ECEFF4;--tx2:#AFB5C0;--tx3:#9CA5B4;
  --pri:#3C66BA;--pri-h:#4673CC;--pri-a:#335AA6;--pri-ink:#FFFFFF;--pri-soft:rgba(133,175,245,.16);--ac:#85AFF5;--focus:#85AFF5;
  --ctl-bg:#292c33;--ctl-h:#31353d;--ctl-a:#3a3f49;--hover:rgba(255,255,255,.06);--press:rgba(255,255,255,.11);
  --ok:#8CC9A8;--warn:#E8BC72;--err:#EF9A9A;--info:#85AFF5;--err-fill:#A93232;--err-fill-h:#B83A3A;--shadow:0 8px 24px rgba(0,0,0,.45);--scrim:rgba(8,9,11,.6);--art-edge:rgba(255,255,255,.1);
}
html[data-theme=light]{
  color-scheme:light;
  --bg0:#F3F4F6;--bg1:#FFFFFF;--bg2:#E9ECF1;--bg3:#DEE3EA;--line:#CDD3DD;--ctl-b:#7B8495;
  --tx:#1F232B;--tx2:#565F70;--tx3:#5F6879;
  --pri:#315EB4;--pri-h:#2A52A0;--pri-a:#234689;--pri-ink:#FFFFFF;--pri-soft:rgba(49,94,180,.12);--ac:#315EB4;--focus:#315EB4;
  --ctl-bg:#FFFFFF;--ctl-h:#EEF1F5;--ctl-a:#E2E6EC;--hover:rgba(0,0,0,.05);--press:rgba(0,0,0,.09);
  --ok:#256441;--warn:#77520D;--err:#A93232;--info:#315EB4;--err-fill:#A93232;--err-fill-h:#B83A3A;--shadow:0 8px 24px rgba(20,30,50,.2);--scrim:rgba(20,26,34,.4);--art-edge:rgba(0,0,0,.14);
}
html[data-density=compact]{--rowh:28px}
html[data-density=comfortable]{--rowh:32px}
/* Reduced motion: system preference or review preview toggle. Keep both blocks identical. */
@media (prefers-reduced-motion:reduce){
  :root{--d-fast:0.01ms;--d-med:0.01ms;--d-slow:0.01ms}
  *,*::before,*::after{animation:none!important;scroll-behavior:auto!important}
}
html[data-motion=reduce]{--d-fast:0.01ms;--d-med:0.01ms;--d-slow:0.01ms}
html[data-motion=reduce] *,html[data-motion=reduce] *::before,html[data-motion=reduce] *::after{animation:none!important}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:var(--fs-body)/1.4 var(--font);background:var(--bg0);color:var(--tx);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:11px var(--mono);padding:0 5px;border:1px solid var(--ctl-b);border-radius:3px;background:var(--bg1);color:var(--tx2)}
.prose{max-width:68ch}

#app{height:100%;display:grid;grid-template-rows:32px minmax(0,1fr) 22px}
.titlebar{display:flex;align-items:center;gap:var(--s8);padding:0 var(--s8) 0 var(--s12);background:var(--bg1);border-bottom:1px solid var(--line);user-select:none;min-width:0}
.brand{display:flex;gap:var(--s8);align-items:center;font-weight:600;flex:none}
.logo-mark{width:16px;height:16px}
.fxlabel{font-size:var(--fs-meta);color:var(--tx3);border:1px dashed var(--ctl-b);border-radius:3px;padding:0 6px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.titlebar .sp,.statusbar .sp{flex:1}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:0}
.rail{position:relative;z-index:20;background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:var(--s4);padding:var(--s8) 0}
.nav{position:relative;width:var(--hit);height:var(--hit);display:grid;place-items:center;border:0;background:none;border-radius:var(--r);color:var(--tx2);cursor:pointer;transition:background var(--d-fast) var(--ease),color var(--d-fast) var(--ease)}
.nav:hover,.nav.is-hover{background:var(--hover);color:var(--tx)}
.nav:active{background:var(--press)}
.nav[aria-current=page]{background:var(--bg3);color:var(--tx)}
.nav[aria-current=page]::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:2px;border-radius:0 2px 2px 0;background:var(--ac)}
.nav svg{width:var(--glyph);height:var(--glyph)}
.nav .badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--pri);color:var(--pri-ink);font-size:10px;font-weight:600;line-height:15px;text-align:center;box-shadow:0 0 0 2px var(--bg1)}
.nav::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--bg3);border:1px solid var(--ctl-b);color:var(--tx);padding:3px 8px;border-radius:var(--r);font-size:var(--fs-label);white-space:nowrap;opacity:0;pointer-events:none;z-index:70;box-shadow:var(--shadow);transition:opacity var(--d-fast) var(--ease)}
.nav:hover::after,.nav.is-hover::after{opacity:1;transition-delay:.3s}
.nav:focus-visible::after{opacity:1;transition-delay:0s}
.workspace{display:grid;grid-template-rows:var(--toolbar) minmax(0,1fr);min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:var(--s8);padding:0 var(--s12);border-bottom:1px solid var(--line);background:var(--bg0);min-width:0}
.crumb{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb small{font-weight:400;color:var(--tx3)}
.search{margin-left:auto;position:relative;width:min(280px,40%);flex:none}
.search input{width:100%;height:var(--ctl);border:1px solid var(--ctl-b);background:var(--ctl-bg);border-radius:var(--r);padding:0 34px 0 28px}
.search input:focus{outline:2px solid var(--focus);outline-offset:2px;border-color:var(--focus)}
.search input:hover{border-color:var(--tx2)}
.search input:focus:hover{border-color:var(--focus)}
.search input::placeholder{color:var(--tx3)}
.search svg{position:absolute;left:8px;top:7px;color:var(--tx3);pointer-events:none}
.search kbd{position:absolute;right:5px;top:4px}
#scroll{overflow:auto;min-height:0;position:relative}
#view{padding:var(--pad);min-height:100%}
#view.in{animation:fadein var(--d-med) var(--ease)}
@keyframes fadein{from{opacity:0}}
.statusbar{display:flex;align-items:center;gap:var(--s16);padding:0 var(--s12);background:var(--bg1);border-top:1px solid var(--line);font-size:var(--fs-meta);color:var(--tx3);min-width:0;white-space:nowrap;overflow:hidden}
@media (max-width:1000px){.sbhint{display:none}}
@media (max-width:1100px){.fxlabel{display:none}}

/* ---- primitives ---- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--s6);height:var(--ctl);padding:0 var(--s8);border:1px solid var(--ctl-b);background:var(--ctl-bg);border-radius:var(--r);cursor:pointer;white-space:nowrap;font-size:var(--fs-body);transition:background var(--d-fast) var(--ease),border-color var(--d-fast) var(--ease),color var(--d-fast) var(--ease)}
.btn:hover:not(:disabled):not([aria-disabled=true]),.btn.is-hover:not(:disabled):not([aria-disabled=true]){background:var(--ctl-h);border-color:var(--tx2)}
.btn:active:not(:disabled):not([aria-disabled=true]),.btn.is-pressed:not(:disabled):not([aria-disabled=true]){background:var(--ctl-a);border-color:var(--tx)}
.btn.is-focus{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
.btn.primary:hover:not(:disabled):not([aria-disabled=true]),.btn.primary.is-hover:not(:disabled):not([aria-disabled=true]){background:var(--pri-h);border-color:var(--pri-h)}  /* primary hover/pressed fills: lead-approved extra tokens (dark 4673CC/335AA6, light 2A52A0/234689) */
.btn.primary:active:not(:disabled):not([aria-disabled=true]),.btn.primary.is-pressed:not(:disabled):not([aria-disabled=true]){background:var(--pri-a);border-color:var(--pri-a)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover:not(:disabled):not([aria-disabled=true]),.btn.ghost.is-hover:not(:disabled):not([aria-disabled=true]){background:var(--hover);color:var(--tx);border-color:transparent}
.btn.ghost:active:not(:disabled):not([aria-disabled=true]),.btn.ghost.is-pressed:not(:disabled):not([aria-disabled=true]){background:var(--press);color:var(--tx);border-color:transparent}
.btn.danger{color:var(--err);border-color:var(--err);background:transparent}
.btn.danger:hover:not(:disabled):not([aria-disabled=true]),.btn.danger.is-hover:not(:disabled):not([aria-disabled=true]){background:var(--hover);border-color:var(--err)}
.btn.danger:active:not(:disabled):not([aria-disabled=true]),.btn.danger.is-pressed:not(:disabled):not([aria-disabled=true]){background:var(--press);border-color:var(--err)}
.btn.danger.fill{background:var(--err-fill);color:#fff;border-color:var(--err);font-weight:600}
.btn.danger.fill:hover:not(:disabled):not([aria-disabled=true]),.btn.danger.fill.is-hover:not(:disabled):not([aria-disabled=true]){background:var(--err-fill-h)}
.btn.danger.fill:active:not(:disabled):not([aria-disabled=true]),.btn.danger.fill.is-pressed:not(:disabled):not([aria-disabled=true]){background:var(--err-fill);box-shadow:inset 0 0 0 2px var(--pri-ink)}
.btn.lg{height:32px;padding:0 var(--s12)}
.btn.sm{height:var(--ctl-sm);padding:0 var(--s8);font-size:var(--fs-label)}
.btn.icon{width:var(--ctl);padding:0}
.btn.sm.icon{width:var(--ctl-sm)}
.btn[disabled],.btn[aria-disabled=true],.btn.primary[disabled],.btn.danger[disabled],.btn.danger.fill[disabled]{cursor:not-allowed;color:var(--tx3);background:var(--bg2);border-color:var(--line);box-shadow:none;font-weight:400}
.btn.ghost[disabled]{background:transparent;border-color:transparent}
.btn[aria-busy=true]{cursor:progress;pointer-events:none}
.btn[aria-busy=true]::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--ctl-b);border-radius:var(--r);overflow:hidden;background:var(--ctl-bg);height:var(--ctl)}
.seg button{min-width:var(--ctl);padding:0 var(--s8);border:0;background:none;cursor:pointer;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;gap:var(--s4);transition:background var(--d-fast),color var(--d-fast)}
.seg button+button{border-left:1px solid var(--line)}
.seg:hover{border-color:var(--tx2)}
.seg:has(button:active){border-color:var(--tx)}
.seg button:hover,.seg button.is-hover{background:var(--ctl-h);color:var(--tx)}
.seg button:active{background:var(--ctl-a)}
.seg button[disabled]:hover{background:var(--bg2);color:var(--tx3)}
.seg button[aria-pressed=true],.seg button[aria-checked=true]{background:var(--pri-soft);color:var(--tx);box-shadow:inset 0 -2px 0 var(--ac)}
.seg button:focus-visible,.seg button.is-focus{outline-offset:-2px}
.seg button.is-focus{outline:2px solid var(--focus)}
.seg button[disabled]{color:var(--tx3);cursor:not-allowed;background:var(--bg2)}
select,.field{height:var(--ctl);border:1px solid var(--ctl-b);background:var(--ctl-bg);border-radius:var(--r);padding:0 var(--s8);color:var(--tx)}
select:hover,.field:hover{background:var(--ctl-h);border-color:var(--tx2)}
select:active,.field:active{border-color:var(--tx)}
select[disabled]:hover,.field[disabled]:hover{background:var(--bg2);border-color:var(--line)}
.field::placeholder{color:var(--tx3)}
.field.is-focus{outline:2px solid var(--focus);outline-offset:2px}
.field[disabled],select[disabled]{color:var(--tx3);background:var(--bg2);border-color:var(--line);cursor:not-allowed}
.field.invalid{border-color:var(--err)}
input[type=range],input[type=checkbox],input[type=radio]{accent-color:var(--pri);vertical-align:middle}
.chk{display:inline-flex;align-items:center;gap:var(--s6);cursor:pointer;color:var(--tx2)}
.fl{display:inline-flex;align-items:center;gap:var(--s6);color:var(--tx2);font-size:var(--fs-label)}
.chip{display:inline-flex;align-items:center;gap:var(--s4);height:18px;padding:0 6px;border-radius:3px;border:1px solid var(--line);font-size:var(--fs-meta);color:var(--tx2);white-space:nowrap}
.chip.fx{border-style:dashed;border-color:var(--ctl-b)}
.chip.ok{color:var(--ok);border-color:currentColor}.chip.warn{color:var(--warn);border-color:currentColor}.chip.err{color:var(--err);border-color:currentColor}.chip.ac{color:var(--ac);border-color:currentColor}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block}
.imdb{display:inline-flex;align-items:center;gap:var(--s6);white-space:nowrap}
.imdb b{background:var(--imdb);color:var(--imdb-ink);font-size:10px;font-weight:700;line-height:14px;padding:0 4px;border-radius:2px;letter-spacing:.2px}
.imdb span{font-size:var(--fs-label);font-weight:600;color:var(--tx)}
.imdb span i{font-style:normal;font-weight:400;color:var(--tx3);font-size:var(--fs-meta)}
.imdb.na span{color:var(--tx3);font-weight:400}
.panel{background:var(--bg1);border:1px solid var(--line);border-radius:var(--rp)}
.pad{padding:var(--s16)}
.row{display:flex;align-items:center;gap:var(--s8)}.wrap{flex-wrap:wrap}.sp1{flex:1;min-width:0}
.gap12{gap:var(--s12)}
.h1{font-size:var(--fs-head);font-weight:600}
.title{font-size:var(--fs-title);font-weight:600;line-height:1.25}
.h2{font-size:var(--fs-meta);font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3)}
.stack>*+*{margin-top:var(--s8)}
.callout{display:flex;gap:var(--s8);align-items:flex-start;padding:var(--s8) var(--s12);border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);margin-bottom:var(--s12)}
.callout .ico{flex:none;margin-top:1px;color:var(--tx3)}
.callout.warn .ico{color:var(--warn)}.callout.err .ico{color:var(--err)}.callout.ok .ico{color:var(--ok)}.callout.info .ico{color:var(--info)}
.callout .t{font-weight:600}
.callout .acts{margin-left:auto;display:flex;gap:var(--s6);flex:none}
.empty{display:grid;place-items:center;text-align:center;padding:48px var(--s16);border:1px dashed var(--ctl-b);border-radius:var(--rp);color:var(--tx2)}
.empty svg{margin-bottom:var(--s8);color:var(--tx3)}
.empty h3{color:var(--tx);font-size:14px;font-weight:600;margin-bottom:var(--s4)}
.empty p{max-width:460px;margin-bottom:var(--s12)}
.sk{background:var(--bg2);border-radius:var(--r);position:relative;overflow:hidden}
@keyframes pulse{50%{opacity:.55}}
.sk{animation:pulse 1.4s ease-in-out infinite}

/* ---- browse ---- */
.vbar{display:flex;align-items:center;gap:var(--s8);flex-wrap:wrap;position:sticky;top:calc(var(--pad) * -1);z-index:5;background:var(--bg0);padding:var(--s8) 0 var(--s6);margin-top:calc(var(--pad) * -1)}
.metaline{display:flex;align-items:center;gap:var(--s8);color:var(--tx3);font-size:var(--fs-meta);margin:0 0 var(--s12);min-height:var(--ctl-sm)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pw,150px),1fr));gap:var(--s16) var(--s12)}
.card{position:relative;min-width:0}
.card .art{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.card .art>svg,.card .art .ph{display:block;width:100%;height:100%}
.card .art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--art-edge);pointer-events:none;transition:box-shadow var(--d-fast) var(--ease)}
.card:hover .art::after,.card.force-ov .art::after{box-shadow:inset 0 0 0 1px var(--ctl-b)}
.card.is-sel .art::after{box-shadow:inset 0 0 0 2px var(--ac)}
/* focus ring is drawn on the outer art frame (outside the art, never under the overlay) */
.card-main{position:absolute;inset:0;z-index:1;border:0;padding:0;background:none;cursor:pointer;border-radius:inherit}
.card-main:focus-visible{outline:none}
.card:has(.card-main:focus-visible) .art{outline:2px solid var(--focus);outline-offset:2px}
/* hover/focus panel: bounded, opaque, themed surface at the bottom of the 2:3 art; uses primitive buttons unchanged */
.card .ov{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;gap:var(--s6);padding:var(--s6);background:var(--bg1);color:var(--tx);border-top:1px solid var(--line);opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--d-fast) var(--ease),visibility 0s var(--d-fast)}
.card:hover .ov,.card:focus-within .ov,.card.force-ov .ov{opacity:1;visibility:visible;transition-delay:0s}
.ov .facts{font-size:var(--fs-meta);color:var(--tx2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .syn{font-size:var(--fs-label);line-height:1.35;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ov .acts{display:flex;flex-wrap:nowrap;gap:var(--s6);pointer-events:auto;min-width:0}
.ov .acts .btn:first-child{flex:1 1 auto;min-width:0}
.ov .acts .btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ov .acts .btn.icon{flex:none}
.card .kind{position:absolute;top:var(--s6);left:var(--s6);z-index:0;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;background:rgba(12,14,17,.78);color:#E6E9EE;border-radius:2px;padding:0 5px;line-height:15px;pointer-events:none}
.cmeta{height:var(--card-meta);padding-top:var(--s6);overflow:hidden}
.cmeta .ttl{font-weight:600;line-height:18px;height:36px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cmeta .sub{color:var(--tx3);font-size:var(--fs-meta);line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta .rate{line-height:16px;margin-top:var(--s2);height:16px}
.card.is-load .art .sk{position:absolute;inset:0;border-radius:0}
.card.is-load .cmeta .sk{height:14px;margin-top:var(--s2);width:75%}
.card.is-load .cmeta .sk+.sk{width:45%;height:12px;margin-top:var(--s6)}
.failbox{display:grid;place-items:center;align-content:center;gap:var(--s6);text-align:center;padding:var(--s8);width:100%;height:100%;color:var(--tx3)}
.failbox .ft{font-size:var(--fs-label);font-weight:600;color:var(--tx2);line-height:1.25}
.failbox .fs{font-size:var(--fs-meta)}
.list{border:1px solid var(--line);border-radius:var(--rp);overflow:hidden;background:var(--bg1)}
.lrow{position:relative;display:grid;grid-template-columns:36px minmax(160px,2fr) 60px 70px minmax(100px,1.2fr) 92px 120px;gap:var(--s12);align-items:center;min-height:56px;padding:var(--s4) var(--s12);border-top:1px solid var(--line);transition:background var(--d-fast)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--hover)}
.lrow.is-sel{background:var(--pri-soft)}
.lrow-main{position:absolute;inset:0;border:0;background:none;cursor:pointer;z-index:0}
.lrow-main:focus-visible{outline-offset:-2px}
.lrow>*:not(.lrow-main){position:relative;z-index:1;pointer-events:none}
.lrow>.btn{pointer-events:auto}
.lrow.head{min-height:28px;color:var(--tx3);font-size:var(--fs-meta);text-transform:uppercase;letter-spacing:.5px;background:var(--bg0)}
.lrow.head:hover{background:var(--bg0)}
.lrow .th{width:36px;height:54px;border-radius:2px;overflow:hidden}
.lrow .th svg{display:block;width:100%;height:100%}
.lrow .qa{justify-self:end;opacity:0;transition:opacity var(--d-fast)}
.lrow:hover .qa,.lrow:focus-within .qa{opacity:1}

  const stars=n=>Array.from({length:n},(_,i)=>`<circle cx="${(rnd(it.id,i)*W).toFixed(0)}" cy="${(rnd(it.id,i+50)*hz*.8).toFixed(0)}" r="${rnd(it.id,i+9)>.8?1.1:.6}" fill="${lt}" opacity=".5"/>`).join('');

   forest:ridge(it.id,hz-H*.02,H*.1,n,L[0])+Array.from({length:n*2},(_,i)=>{const x=W*(i+.5)/(n*2),hh=H*(.12+.08*rnd(it.id,i)),y=hz+H*.14+(i%2)*H*.05,w=W/(n*2)*.9;return `<polygon points="${(x-w).toFixed(1)},${(y+H*.2).toFixed(1)} ${x.toFixed(1)},${(y-hh).toFixed(1)} ${(x+w).toFixed(1)},${(y+H*.2).toFixed(1)}" fill="${L[i%2?2:1]}"/>`}).join('')+`<rect y="${hz+H*.3}" width="${W}" height="${H}" fill="${L[2]}"/>`,

/* ============ navigation ============ */
const chromeKey=()=>{const a=document.activeElement;return a&&a.dataset&&a.dataset.nk&&a.closest('#side')?a.dataset.nk:null};
const TITLES={browse:'Browse',transfers:'Transfers',settings:'Settings',about:'About'};
function snap(){return {screen:S.screen,sel:S.sel,season:S.season,ep:S.ep,srcSel:S.srcSel}}
function go(screen,opts={},push=true){
  if(push&&['detail','sources','prepare'].includes(screen)&&S.screen!==screen)S.stack.push(snap());
  if(!push&&opts.top)S.stack=[];
  if(screen==='browse'||screen==='transfers'||screen==='settings'||screen==='about'){if(opts.top!==false)S.stack=[]}
  const from=S.screen;
  Object.assign(S,opts.set||{});S.screen=screen;
  if(from!==screen||opts.force)clearTimers();
  if(screen==='prepare'&&!S.prep)startPrepare();
  transition(from!==screen||opts.force);
}
function back(){
  if(S.screen==='prepare'){S.prep=null}
  const p=S.stack.pop();
  if(!p){if(['detail','sources','prepare','perf','gallery'].includes(S.screen))go('browse',{top:true});return}
  clearTimers();if(S.screen==='prepare'&&p.screen!=='prepare')S.prep=null;
  const from=S.screen;Object.assign(S,p);transition(true,true);
}
function transition(animate,restore){
  /* Render the target route immediately (no exit delay, no timers). Entry is a short opacity fade; reduced motion is instant. */
  const v=$('#view'),sc=$('#scroll');
  renderAll();
  if(animate&&!reduce()){v.classList.remove('in');void v.offsetWidth;v.classList.add('in')}
  if(restore&&S.screen==='browse'){sc.scrollTop=S.bscroll||0;const el=S.mark&&$(`.card-main[data-id="${S.mark}"],.lrow-main[data-id="${S.mark}"]`);if(el)el.focus({preventScroll:true})}
  else if(animate)sc.scrollTop=0;
}

function srcList(it,ep){
  const F=S.srcF;let all=sourcesFor(it,ep).filter(s=>s.idx===F.idx);
  if(is('sourceEmpty'))all=[];
  let l=all.filter(s=>F.qs.includes(s.q)&&(!F.cached||s.cached)&&(!F.text||s.name.toLowerCase().includes(F.text.toLowerCase())));
  if(is('filtered'))l=[];
  const qo={'2160p':4,'1080p':3,'720p':2,'480p':1};
  l.sort(F.sort==='seed'?(a,b)=>b.seed-a.seed:F.sort==='size'?(a,b)=>a.size-b.size:(a,b)=>qo[b.q]-qo[a.q]||b.seed-a.seed);
  return {all,l};
}

/* ---- prepare ---- */
function startPrepare(){
  clearTimers();
  const it=byId(S.sel),ep=it.k==='series'?S.ep:null,src=sourcesFor(it,ep).find(s=>s.id===S.srcSel);
  S.prep={stage:0,src,file:null,err:null,fid:null,launched:false};
  if(is('quotaFull'))ensureQuotaFixture();
  if(is('success')){S.prep.stage=2;S.prep.file=filesFor(it,ep,src)[0];beginDownload(true);return}
  if(is('connError')){later(()=>{S.prep.err='conn';S.state=null;renderView()},900);return}
  later(()=>{const r=$('#req');if(r){r.style.transition='width 1.1s ease-out';r.style.width='96%'}},260);
  later(()=>{S.prep.stage=1;renderView()},reduce()?200:1400);
}
function ensureQuotaFixture(){if(!S.files.find(f=>f.id==='fq'))S.files.push({id:'fq',name:'Fixture.Archive.Collection.mkv',size:Math.max(0,S.limit-used()-.1),pct:100,fx:true})}
function stepper(p){
  const L=['Request files','Choose file','Cache &amp; launch'];
  return `<ol class="steps" aria-label="Progress">${L.map((l,i)=>`<li class="${p.err&&i===p.stage?'bad':i<p.stage||p.launched?'done':i===p.stage?'cur':''}" ${i===p.stage?'aria-current="step"':''}><span class="n">${i<p.stage||p.launched?'✓':i+1}</span><span>${l}</span></li>`).join('')}</ol>`;
}

function beginDownload(already){
  const p=S.prep,it=byId(S.sel);
  if(!already){
    if(p.file.size>free()+1e-9){p.stage=2;p.quota=true;p.fid=null;renderView();renderChrome();return}
  }
  p.quota=false;p.stage=2;
  let f=S.files.find(x=>x.id===p.fid);
  if(!f){f={id:'d'+Date.now(),name:p.file.name,size:p.file.size,pct:already?40:0};S.files.push(f);p.fid=f.id}
  renderView();renderChrome();
}

/* ============ live updates (download ticks) ============ */
function updateLive(){
  S.files.forEach(f=>{
    $$(`[data-dlbar="${f.id}"]`).forEach(b=>{const i=$('i',b);if(i)i.style.width=f.pct+'%';b.setAttribute('aria-valuenow',Math.round(f.pct))});
    $$(`[data-dltxt="${f.id}"]`).forEach(t=>t.textContent=t.closest('.trow')?Math.round(f.pct)+'%':`${Math.round(f.pct)}% of ${gib(f.size)} (simulated)`);
  });
  const n=S.files.filter(f=>f.pct<100&&!sessFor(f)).length+S.sessions.length;$$('.nav .badge').forEach(b=>b.textContent=n);
}
setInterval(()=>{
  let ch=false,done=false;
  S.files.forEach(f=>{if(f.pct<100){f.pct=Math.min(100,f.pct+1.6);ch=true;if(f.pct>=100)done=true}});
  if(!ch)return;
  updateLive();updateChip();if(done)renderChrome();
  const p=S.prep;
  if(S.screen==='prepare'&&p&&p.stage===2&&p.fid){
    const f=S.files.find(x=>x.id===p.fid);
    if(f&&f.pct>=5){const b=$('[data-launch]');if(b&&b.disabled){b.disabled=false;const r=$('[data-readytxt]');if(r)r.textContent='Illustrative: this prototype allows launch at 5% cached. Real readiness rules aren’t defined here. Download continues.'}}
    if(done)renderView();
  }
  if(done&&S.screen==='transfers')renderView();
},500);

/* ============ actions ============ */
function setState(name,screen){
  clearTimers();S.state=name;
  if(screen!==S.screen&&['detail','sources','prepare'].includes(screen)){
    if(!S.sel)S.sel=name==='noImdb'?7:1;
    if(screen!=='detail'&&byId(S.sel).imdb===null){S.sel=1;S.ep=null;S.srcSel=null}
    const it=byId(S.sel);
    if(it.k==='series'&&!S.ep)S.ep={s:S.season,e:1};
    if(screen!=='detail'&&!S.srcSel)S.srcSel=1;
  }
  if(name==='noImdb'&&screen==='detail'&&S.sel&&byId(S.sel).k==='series'&&!S.ep)S.ep={s:S.season,e:1};
  if(screen==='prepare'){S.prep=null;if(!S.srcSel)S.srcSel=1}
  if(name==='session'){seedSession();S.state=null}
  if(name==='quotaFull'&&screen==='transfers'){ensureQuotaFixture()}
  const dirty=screen!==S.screen;
  S.screen=screen;
  if(!dirty&&screen==='prepare')S.prep=null;
  if(screen==='prepare')startPrepare();
  transition(true);
}
function seedSession(){
  if(S.sessions.length)return;
  const it=byId(3);const f={id:'fs'+Date.now(),name:'Paper.Cities.S01E01.1080p.WEB-DL.x264-NOVA.mkv',size:1.2,pct:100};
  if(free()<f.size)S.limit=Math.ceil(used()+f.size+1);
  S.files.push(f);S.sessions.push({id:'s'+Date.now(),fid:f.id,title:'Paper Cities S01E01',player:S.player,port:41873});
}

function toggleMenu(force){

  const group=(name,scr2)=>`<h4>${name} states</h4>`+STATE_DEFS[scr2].map(([k,l])=>`<button role="menuitem" data-ms="${scr2}|${k}"><span class="ck">${S.state===k&&S.screen===scr2?'✓':''}</span>${l}</button>`).join('');
  const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');m.setAttribute('aria-label','Review controls');
  m.innerHTML=`<button role="menuitem" data-ms="clear"><span class="ck">${S.state?'':'✓'}</span><b>Normal (no forced state)</b></button><hr>${['browse','detail','sources','prepare','transfers'].map(s=>group(TITLES[s]||(s[0].toUpperCase()+s.slice(1)),s)).join('')}<hr><h4>Design review</h4><button role="menuitem" data-ms="rev|gallery"><span class="ck">${S.screen==='gallery'?'✓':''}</span>Components gallery</button><button role="menuitem" data-ms="rev|perf"><span class="ck">${S.screen==='perf'?'✓':''}</span>Performance preview (1000 cards)</button><hr><h4>Simulate</h4><button role="menuitem" data-ms="quit"><span class="ck"></span>Window-close / quit request…</button><button role="menuitem" data-ms="keys"><span class="ck"></span>Keyboard shortcuts…</button>`;
  document.body.append(m);
  $('button',m).focus();
  m.addEventListener('click',e=>{
    const b=e.target.closest('[data-ms]');if(!b)return;const v=b.dataset.ms;toggleMenu(false);$('#menubtn').focus();
    if(v==='clear'){S.state=null;S.prep=null;if(S.screen==='prepare'){S.stack=[];go('browse',{top:true})}else renderView()}
    else if(v==='quit')quitRequest();else if(v==='keys')shortcuts();
    else if(v.startsWith('rev|'))openReview(v.slice(4));
    else{const [sc,k]=v.split('|');setState(k,sc)}
  });

    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const bs=$$('button',m),i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus()}
    if(e.key==='Tab'){toggleMenu(false)}
  });
}

  if(!n){dialog({title:'No active sessions',body:'<p>Without active sessions, the real app quits straight away with no confirmation. Prototype: nothing quits.</p>',acts:[{label:'OK'}]});return}

/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{
  if(dlgEl){if(e.key==='Escape'&&dlgEl.sc.firstChild.getAttribute('role')!=='alertdialog'){e.preventDefault();closeDialog()}else if(e.key==='Escape'){e.preventDefault();closeDialog()}return}
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='radio'&&document.activeElement.type!=='checkbox'&&document.activeElement.type!=='range';
  if(e.key==='Escape'){
    if(S.menu){toggleMenu(false);$('#menubtn').focus();return}
    if(document.activeElement===$('#q')&&$('#q').value){$('#q').value='';S.q='';renderView();return}
    if(typing){document.activeElement.blur();return}
    if(S.screen==='sources'&&S.srcSel){S.srcSel=null;renderView();return}
    if(['detail','sources','prepare','perf','gallery'].includes(S.screen))back();return}
  if(typing)return;
  if((e.key==='/'&&!e.ctrlKey)||(e.key==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();$('#q').focus();$('#q').select();return}
  if(e.key==='?'){shortcuts();return}
  if(e.altKey&&e.key==='ArrowLeft'){back();return}
  if(e.altKey&&'1234'.includes(e.key)){e.preventDefault();S.prep=null;go(['browse','transfers','settings','about'][+e.key-1],{top:true});return}
  if(/^(Arrow|Home$|End$|Page)/.test(e.key)){
    if(S.screen==='perf'&&perfKey(e))return;
    const sel=e.target.closest('[data-nav]');if(!sel)return;
    const kind=sel.dataset.nav,all=$$(`[data-nav="${kind}"]`),i=all.indexOf(sel);let n=i;
    const grid=kind==='item'&&S.view==='grid';
    const cols=grid?(all.filter(x=>Math.abs(x.getBoundingClientRect().top-all[0].getBoundingClientRect().top)<4).length||1):1;
    if(e.key==='Home')n=0;else if(e.key==='End')n=all.length-1;
    else if(e.key==='PageDown')n=i+(grid?cols*3:8);else if(e.key==='PageUp')n=i-(grid?cols*3:8);
    else if(grid)n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:e.key==='ArrowDown'?i+cols:i-cols;
    else n=(e.key==='ArrowDown'||e.key==='ArrowRight')?i+1:(e.key==='ArrowUp'||e.key==='ArrowLeft')?i-1:i;
    n=Math.max(0,Math.min(all.length-1,n));
    if(n!==i&&all[n]){e.preventDefault();all[n].focus()}
  }
});

let PERF=null;
const PGEN=['Drama','Mystery','Adventure','Sci-Fi','Thriller','Crime','Comedy','Romance'],PMOT=['sun','peaks','city','waves','eclipse','forest','orbit'];
function perfItems(){
  if(PERF)return PERF;
  const A=['Harbor','Salt','Quiet','Glass','Paper','Northern','Hollow','Winter','Copper','Lantern','Tidal','Iron','Silent','Amber','Distant','Low','Slate','Ninth','Velvet','Cinder'],Bw=['Meridian','Line','Orbit','Pines','Tide','Cities','Ferry','Archive','Signal','Ledger','Frontier','Harvest','Lights','Garden','Reach','Station','Crossing','Atlas','Weather','Hours'];
  PERF=Array.from({length:1000},(_,i)=>{const a=A[i%20],b=Bw[(i*7+Math.floor(i/20))%20];return {id:1001+i,t:`${a} ${b}`,y:1985+(i*7)%41,k:i%3===0?'series':'movie',rt:84+(i*11)%70,seasons:1+(i%5),g:[PGEN[i%8],PGEN[(i*3+1)%8]],hue:(i*37)%360,m:PMOT[i%7],tm:5+((i*13)%40)/10,im:i%11===0?null:i%97===3?0:+(5+((i*17)%45)/10).toFixed(1),imdb:'tt'+i,syn:`Fixture synopsis generated for the performance preview. ${a} and ${b} are fictional.`,artFail:i%37===5,cast:[]}});

/* Global artwork job queue. Bound of 4 holds across generations: a running job cannot be cancelled (like an image decode),
   so its slot is held until it settles and its result is rejected as stale. Only queued jobs are dropped. */
const AJ={max:4,active:0,peak:0,live:0,livePeak:0,queue:[],running:new Set(),gen:0,started:0,done:0,failed:0,dropped:0,stale:0};
function ajEnqueue(ph,idx){if(!PV.on||!ph.isConnected||ph._j||ph.dataset.done)return;const vw=document.getElementById('vwrap');if(!vw||!vw.contains(ph))return;const j={ph,idx,gen:AJ.gen,state:'q',stale:false};ph._j=j;AJ.queue.push(j);ajPump()}
function ajDrop(ph){const j=ph._j;if(!j)return;ph._j=null;if(j.state==='q'){const k=AJ.queue.indexOf(j);if(k>=0)AJ.queue.splice(k,1);AJ.dropped++}else j.stale=true}
function ajReset(){AJ.gen++;AJ.dropped+=AJ.queue.length;AJ.queue.forEach(j=>{j.ph._j=null});AJ.queue=[];AJ.running.forEach(j=>{j.stale=true})}
function ajPump(){
  while(AJ.active<AJ.max&&AJ.queue.length){
    const vc=$('#scroll').getBoundingClientRect(),mid=(vc.top+vc.bottom)/2;let bi=0,bd=Infinity;
    AJ.queue.forEach((j,i)=>{const r=j.ph.getBoundingClientRect(),d=Math.abs((r.top+r.bottom)/2-mid);if(d<bd){bd=d;bi=i}});
    const j=AJ.queue.splice(bi,1)[0];
    if(!j.ph.isConnected||!PV.on){j.ph._j=null;AJ.dropped++;continue}
    j.state='r';AJ.running.add(j);AJ.active++;AJ.live++;AJ.started++;
    AJ.peak=Math.max(AJ.peak,AJ.active);AJ.livePeak=Math.max(AJ.livePeak,AJ.live);
    setTimeout(()=>ajSettle(j),40+(j.idx*53)%110);
  }
}
function ajSettle(j){
  AJ.active--;AJ.live--;AJ.running.delete(j);
  if(j.stale||j.gen!==AJ.gen||!j.ph.isConnected)AJ.stale++;
  else{const it=PV.list[j.idx];j.ph._j=null;j.ph.dataset.done=1;
    if(!it){AJ.stale++}else if(it.artFail){j.ph.outerHTML=failInner(it);AJ.failed++}else{j.ph.innerHTML=art(it,'poster');AJ.done++}}
  ajPump();perfDiagSoon();
}
const PV={stressIter:0,stressDone:false,on:false,items:[],list:[],cols:1,cw:0,rowH:0,gap:12,rowGap:16,meta:76,over:2,rows:new Map(),io:null,raf:0,dr:0,fidx:-1,maxCards:0,cards:0,range:[0,-1],mountMs:0,cls:0,cls0:0,stress:0,total:0,bound:0};
try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)PV.cls+=e.value}).observe({type:'layout-shift',buffered:true})}catch(_){}
function perfView(){return `<div class="row wrap" style="margin-bottom:var(--s8)"><h1 class="h1">Performance preview</h1><span class="chip fx">Review diagnostics only</span></div>
 <div class="callout info"><div class="ico">${ic('about',16)}</div><div><div class="t"><span class="sr">Notice: </span>Windowed grid demo, not a GPUI benchmark</div><div class="muted">1000 fixture cards. Only visible rows plus ${PV.over} overscan rows (and one row pinned by keyboard focus) exist in the DOM. Artwork is a mock decode job (timer; no network, no cache) through one global queue of ${AJ.max}. Figures are measured in this browser tab for DOM nodes, mock jobs and app state only. They say nothing about GPU or image-cache memory, process RSS, or native GPUI performance.</div></div></div>
 <div class="row wrap" style="margin-bottom:var(--s8)"><label class="fl">Poster size <input type="range" min="132" max="230" value="${S.pw}" data-bind="pw" aria-label="Poster size" style="width:110px"></label>
 <div class="seg" role="group" aria-label="Scroll"><button data-act="perfscroll" data-v="top">Top</button><button data-act="perfscroll" data-v="mid">Middle</button><button data-act="perfscroll" data-v="end">End</button></div>
 <button class="btn sm" data-act="perfstress">Stress: 60 queries + jumps</button><span class="dim" style="font-size:var(--fs-meta)">Use the toolbar search to filter (obsolete work is dropped). Arrow, Home, End and Page keys move between cards.</span></div>
 <dl class="diag" id="diag" aria-label="Measured diagnostics"></dl>
 <div id="vwrap" class="vwrap" role="list" aria-label="Fixture cards, virtualized" tabindex="-1"></div>`}
function perfFilter(){const q=S.q.trim().toLowerCase();PV.list=q?PV.items.filter(i=>i.t.toLowerCase().includes(q)||i.g.join(' ').toLowerCase().includes(q)):PV.items;PV.total=PV.items.length}
function perfLayout(){
  PV.meta=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-meta'))||76;
  const w=$('#vwrap').clientWidth;PV.cols=Math.max(1,Math.floor((w+PV.gap)/(S.pw+PV.gap)));PV.cw=(w-PV.gap*(PV.cols-1))/PV.cols;
  PV.rowH=PV.cw*1.5+PV.meta+PV.rowGap;PV.nrows=Math.ceil(PV.list.length/PV.cols);$('#vwrap').style.height=Math.max(PV.nrows*PV.rowH-PV.rowGap,0)+'px';
  const vis=Math.ceil($('#scroll').clientHeight/PV.rowH)+1;PV.bound=(vis+2*PV.over+1)*PV.cols;
}
function perfUnmountRow(r){const el=PV.rows.get(r);if(!el)return;$$('.ph',el).forEach(ph=>{ajDrop(ph);PV.io&&PV.io.unobserve(ph)});el.remove();PV.rows.delete(r)}
function perfMountRow(r){
  const el=document.createElement('div');el.className='vrow';el.style.cssText=`top:${r*PV.rowH}px;height:${PV.rowH-PV.rowGap}px;--cols:${PV.cols}`;
  const a=r*PV.cols,b=Math.min(PV.list.length,a+PV.cols);let h='';
  for(let i=a;i<b;i++)h+=cardHTML(PV.list[i],{lazy:true,idx:i,total:PV.list.length,act:'perfopen'});
  el.innerHTML=h;$('#vwrap').append(el);PV.rows.set(r,el);$$('.ph',el).forEach(ph=>PV.io.observe(ph));
}
function perfUpdate(){
  if(!PV.on)return;const t0=performance.now(),sc=$('#scroll'),vw=$('#vwrap');if(!vw)return;
  const top=sc.scrollTop-vw.offsetTop,vh=sc.clientHeight;
  const first=Math.max(0,Math.floor(top/PV.rowH)-PV.over),last=Math.min(PV.nrows-1,Math.floor((top+vh)/PV.rowH)+PV.over);
  let pin=-1;const ae=document.activeElement;
  if((ae&&vw.contains(ae))||dlgRetId!=null){const id=(ae&&vw.contains(ae)&&ae.closest('.card'))?+$('.card-main',ae.closest('.card')).dataset.id:dlgRetId;const k=id!=null?PV.list.findIndex(x=>x.id===id):-1;if(k>=0){PV.fidx=k;pin=Math.floor(k/PV.cols)}}
  for(const r of [...PV.rows.keys()])if((r<first||r>last)&&r!==pin)perfUnmountRow(r);
  for(let r=first;r<=last;r++)if(!PV.rows.has(r))perfMountRow(r);
  PV.range=[first,last];PV.cards=$$('.card',vw).length;PV.maxCards=Math.max(PV.maxCards,PV.cards);PV.mountMs=performance.now()-t0;perfDiagSoon();
}
function perfDiagSoon(){if(PV.dr)return;PV.dr=requestAnimationFrame(()=>{PV.dr=0;perfDiag()})}
function perfDiag(){
  const d=$('#diag');if(!d)return;
  const rows=[['Items (shown / total)',`${PV.list.length} / ${PV.total}`,'items'],['Columns × rows',`${PV.cols} × ${PV.nrows}`,'grid'],['Mounted cards (DOM, now)',PV.cards,'cards'],['Mounted cards (DOM, max measured)',PV.maxCards,'maxCards'],['Mounted bound (rows × cols)',PV.bound,'bound'],['Rows mounted',PV.rows.size,'rowsMounted'],['Art jobs active (now)',AJ.active,'active'],['Art jobs active (peak)',AJ.peak,'peak'],['Global bound of 4 held',AJ.peak<=AJ.max&&AJ.livePeak<=AJ.max?'yes':'NO','held'],['Queued',AJ.queue.length,'queued'],['Started',AJ.started,'started'],['Done',AJ.done,'done'],['Failed (simulated)',AJ.failed,'failed'],['Dropped while queued',AJ.dropped,'dropped'],['Stale results rejected',AJ.stale,'stale'],['Layout shift (Chromium only)',PerformanceObserver&&PerformanceObserver.supportedEntryTypes&&PerformanceObserver.supportedEntryTypes.includes('layout-shift')?(PV.cls-PV.cls0).toFixed(4):'n/a','cls'],['Last row mount pass (ms)',PV.mountMs.toFixed(1),'ms'],['Stress iterations (last run)',`${PV.stressIter||0}/60${PV.stressDone?' done':PV.stress?' running':''}`,'stress']];
  d.innerHTML=rows.map(([k,v,m])=>`<div><span class="k">${k}</span><b data-m="${m}">${v}</b></div>`).join('');
}
function perfMount(){
  if(PV.on&&$('#vwrap')&&PV.rows.size&&$('#vwrap').dataset.m)return;
  perfStop();PV.on=true;PV.items=perfItems();PV.rows=new Map();PV.cls0=PV.cls;
  const io=new IntersectionObserver(es=>{if(!PV.on||PV.io!==io)return;for(const e of es){if(!e.target.isConnected){continue}if(e.isIntersecting)ajEnqueue(e.target,+e.target.dataset.lazy);else ajDrop(e.target)}},{root:$('#scroll'),rootMargin:'60px'});PV.io=io;
  const vw=$('#vwrap');vw.dataset.m=1;vw.addEventListener('focusin',e=>{const c=e.target.closest('.card');if(c&&c.dataset.idx!=null)PV.fidx=+c.dataset.idx});
  perfFilter();perfLayout();perfUpdate();
}
function perfStop(keepStress){if(!PV.on)return;PV.on=false;if(PV.io)PV.io.disconnect();PV.io=null;const vw=$('#vwrap');if(vw)$$('.vrow',vw).forEach(r=>r.remove());PV.rows=new Map();ajReset();if(PV.stress&&!keepStress){clearInterval(PV.stress);PV.stress=0}}
function perfFocusState(){const vw=$('#vwrap'),ae=document.activeElement;if(vw&&ae&&vw.contains(ae)){const c=ae.closest&&ae.closest('.card');if(c)return {id:+$('.card-main',c).dataset.id}}return null}
function perfRestoreFocus(st){if(!st||!PV.on)return;const i=PV.list.findIndex(x=>x.id===st.id);PV.fidx=i;if(i>=0)perfFocusIdx(i);else{const v=$('#vwrap');v&&v.focus({preventScroll:true})}}
function perfRefilter(){const st=perfFocusState();ajReset();for(const r of [...PV.rows.keys()])perfUnmountRow(r);perfFilter();perfLayout();$('#scroll').scrollTop=Math.min($('#scroll').scrollTop,Math.max(0,$('#vwrap').offsetTop+PV.nrows*PV.rowH));perfUpdate();perfRestoreFocus(st)}
function perfRelayout(){const st=perfFocusState();ajReset();for(const r of [...PV.rows.keys()])perfUnmountRow(r);perfLayout();perfUpdate();perfRestoreFocus(st)}
function perfStress(){
  if(PV.stress||!PV.on)return;PV.stressIter=0;PV.stressDone=false;const qs=['','a','sal','ri','x','hol','ter','ni','','q','ing'],sc=$('#scroll');let i=0;
  PV.stress=setInterval(()=>{i++;const q=qs[(i*7)%qs.length];$('#q').value=q;S.q=q;perfRefilter();sc.scrollTop=Math.floor(Math.random()*Math.max(1,sc.scrollHeight-sc.clientHeight));
    PV.stressIter=i;perfDiagSoon();
    if(i===30){const st=perfFocusState();perfStop(true);perfMount();perfRestoreFocus(st)}
    if(i>=60){clearInterval(PV.stress);PV.stress=0;PV.stressDone=true;$('#q').value='';S.q='';perfRefilter();perfDiagSoon();toast('Stress finished: 60 iterations')}},25);
}
function perfKey(e){
  const c=e.target.closest&&e.target.closest('#vwrap .card');if(!c)return false;
  const i=+c.dataset.idx,N=PV.list.length,page=Math.max(1,Math.floor($('#scroll').clientHeight/PV.rowH))*PV.cols;let n=i;
  switch(e.key){case'ArrowRight':n++;break;case'ArrowLeft':n--;break;case'ArrowDown':n+=PV.cols;break;case'ArrowUp':n-=PV.cols;break;case'Home':n=0;break;case'End':n=N-1;break;case'PageDown':n+=page;break;case'PageUp':n-=page;break;default:return false}
  n=Math.max(0,Math.min(N-1,n));e.preventDefault();perfFocusIdx(n);return true;
}
function perfFocusIdx(n){
  const sc=$('#scroll'),r=Math.floor(n/PV.cols),off=$('#vwrap').offsetTop,top=off+r*PV.rowH,bot=top+PV.rowH-PV.rowGap;
  if(top<sc.scrollTop)sc.scrollTop=top-8;else if(bot>sc.scrollTop+sc.clientHeight)sc.scrollTop=bot-sc.clientHeight+8;
  perfUpdate();const el=$(`#vwrap .card[data-idx="${n}"] .card-main`);if(el){PV.fidx=n;el.focus({preventScroll:true})}
}
document.addEventListener('DOMContentLoaded',()=>{});
$('#scroll').addEventListener('scroll',()=>{if(S.screen==='perf'&&!PV.raf)PV.raf=requestAnimationFrame(()=>{PV.raf=0;perfUpdate()})},{passive:true});
addEventListener('resize',()=>{if(S.screen==='perf'&&PV.on&&!PV.rz)PV.rz=requestAnimationFrame(()=>{PV.rz=0;perfRelayout()})});

/* ============ boot (deterministic review via ?screen=&state=&theme=) ============ */
(function(){
  const P=new URLSearchParams(location.search),sc=P.get('screen'),st=P.get('state');
  if(P.get('theme')==='light'){document.documentElement.dataset.theme='light';S.themePref='light'}
  if(P.get('motion')==='reduce')document.documentElement.dataset.motion='reduce';
  if(P.get('view')==='list')S.view='list';
  if(P.get('item'))S.sel=+P.get('item');
  if(P.get('sec'))S.setSec=P.get('sec');
  renderAll();
  if(sc==='detail'||sc==='sources'||sc==='prepare'){
    if(!S.sel)S.sel=P.has('item')?+P.get('item'):1;
    const it=byId(S.sel);if(it.k==='series'){S.season=+(P.get('season')||1);S.ep=P.has('ep')?{s:S.season,e:+P.get('ep')}:(sc==='detail'?null:{s:1,e:1})}
    if(sc!=='detail')S.srcSel=+(P.get('src')||1);
    S.stack=[{screen:'browse',sel:null,season:1,ep:null,srcSel:null}];
    S.state=st;S.screen=sc;if(sc==='prepare')startPrepare();
    if(sc==='prepare'&&P.get('stage')==='1'&&S.prep&&!S.prep.err){clearTimers();S.prep.stage=1}
    renderAll();
  }else if(sc==='gallery'||sc==='perf'){S.stack=[{screen:'browse',sel:null,season:1,ep:null,srcSel:null}];S.screen=sc;renderAll();if(sc==='perf'&&P.has('scroll')){const e=$('#scroll');e.scrollTop=+P.get('scroll')*(e.scrollHeight-e.clientHeight);perfUpdate()}}
  else if(sc){if(st==='session')seedSession();else S.state=st;S.screen=sc;renderAll()}
  else if(st){S.state=st;renderAll()}
  if(P.get('menu')==='1')toggleMenu(true);
})();
</script>
